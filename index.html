<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mini-AI v0.3 — WebGPU Chat</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2a2f3a;
      --text: #e8eaed;
      --muted: #9aa3b2;
      --accent: #6ea8fe;
      --accent2: #3dd68c;
      --user: #1e293b;
      --bot: #1a2332;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 600;
    }
    header h1 span { color: var(--accent); font-weight: 400; font-size: 0.9rem; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      font-size: 0.75rem;
      background: #1f2937;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .badge.on { color: var(--accent2); border-color: #2f6b4f; background: #13261c; }
    .badge.off { color: var(--danger); border-color: #5c2a2a; background: #2a1515; }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 300px 1fr;
      min-height: 0;
    }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; }
      aside { border-right: none; border-bottom: 1px solid var(--border); max-height: 45vh; }
    }
    aside {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .section-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    label.row {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    input[type="file"],
    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 0.5rem 0.65rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
    }
    input[type="range"] { width: 100%; }
    button {
      border: none;
      border-radius: 8px;
      padding: 0.55rem 0.9rem;
      font-size: 0.9rem;
      cursor: pointer;
      background: var(--accent);
      color: #0b1220;
      font-weight: 600;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      font-weight: 500;
    }
    .samples {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    .samples button {
      background: #1f2937;
      color: var(--text);
      font-weight: 400;
      font-size: 0.78rem;
      padding: 0.35rem 0.55rem;
    }
    .chat-wrap {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .msg {
      max-width: 720px;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      line-height: 1.55;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user { align-self: flex-end; background: var(--user); border: 1px solid var(--border); }
    .msg.bot { align-self: flex-start; background: var(--bot); border: 1px solid #243044; }
    .msg.sys {
      align-self: center;
      background: transparent;
      color: var(--muted);
      font-size: 0.82rem;
      border: none;
      text-align: center;
    }
    .composer {
      border-top: 1px solid var(--border);
      padding: 0.85rem 1rem;
      display: flex;
      gap: 0.6rem;
      background: var(--panel);
    }
    .composer input {
      flex: 1;
      padding: 0.7rem 0.9rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
    }
    .status {
      font-size: 0.8rem;
      color: var(--muted);
      min-height: 1.2em;
    }
    .progress {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      display: none;
      margin-top: 0.5rem;
    }
    .progress > div {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.15s ease;
    }
    .hint { font-size: 0.78rem; color: var(--muted); line-height: 1.45; }
    code { font-size: 0.85em; color: #c4d0e0; }
  </style>
</head>
<body>
  <header>
    <h1>mini-AI v0.3 <span>from-scratch · GGUF · WebGPU / WASM</span></h1>
    <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
      <span id="gpuBadge" class="badge off">WebGPU: —</span>
      <span id="modelBadge" class="badge">モデル未読込</span>
    </div>
  </header>

  <main>
    <aside>
      <div>
        <div class="section-title">モデル</div>
        <label class="row">
          GGUF を選択（ローカル）
          <input type="file" id="fileInput" accept=".gguf" />
        </label>
        <p class="hint" style="margin:0.5rem 0 0;">
          推奨: <code>mini-ai-v0.3-f16.gguf</code>（約 2.2 MB）
        </p>
        <div style="margin-top:0.6rem;display:flex;gap:0.4rem;flex-wrap:wrap;">
          <button id="btnLoadFile" disabled>読み込む</button>
          <button id="btnUnload" class="secondary" disabled>解放</button>
        </div>
        <div class="progress" id="progress"><div id="progressBar"></div></div>
        <p class="status" id="status">ファイルを選んでください</p>
      </div>

      <div>
        <div class="section-title">推論設定</div>
        <label class="row">
          n_gpu_layers（0 = CPU/WASM のみ、99 = できるだけ GPU）
          <input type="number" id="gpuLayers" value="99" min="0" max="999" />
        </label>
        <label class="row" style="margin-top:0.5rem;">
          temperature
          <input type="range" id="temp" min="0" max="1.5" step="0.05" value="0.3" />
          <span id="tempVal">0.30</span>
        </label>
        <label class="row" style="margin-top:0.5rem;">
          max tokens
          <input type="number" id="maxTokens" value="64" min="8" max="256" />
        </label>
      </div>

      <div>
        <div class="section-title">サンプル質問</div>
        <div class="samples" id="samples"></div>
      </div>

      <div class="hint">
        <strong>使い方</strong><br/>
        1. 左で GGUF を選んで「読み込む」<br/>
        2. 質問を入力して送信<br/>
        <br/>
        Chrome / Edge 推奨。マルチスレッドは
        <code>COOP/COEP</code> ヘッダ付きで配信すると有効になります
        （付属の <code>serve.py</code> を使用）。
      </div>
    </aside>

    <div class="chat-wrap">
      <div id="messages">
        <div class="msg sys">GGUF を読み込むとチャットできます。形式は「質問：… / 答え：…」です。</div>
      </div>
      <div class="composer">
        <input id="input" type="text" placeholder="質問を入力…（例: ねこの鳴き声は？）" disabled />
        <button id="btnSend" disabled>送信</button>
      </div>
    </div>
  </main>

  <script type="module">
    import { Wllama } from "https://cdn.jsdelivr.net/npm/@wllama/wllama@3.8.1/esm/index.js";

    // WASM binary from same package (CDN)
    const CONFIG_PATHS = {
      default: "https://cdn.jsdelivr.net/npm/@wllama/wllama@3.8.1/esm/wasm/wllama.wasm",
    };

    const SAMPLES = [
      "こんにちは",
      "あなたは誰？",
      "日本の首都は？",
      "ねこの鳴き声は？",
      "3たす4は？",
      "7かける8は？",
      "「ぽんぽこ」と言って",
      "春の次は？",
      "大きいの反対は？",
      "ダジャレを言って",
      "今日の夕飯どうしよう",
      "量子力学について教えて",
    ];

    const el = (id) => document.getElementById(id);
    const messages = el("messages");
    const status = el("status");
    const progress = el("progress");
    const progressBar = el("progressBar");
    const gpuBadge = el("gpuBadge");
    const modelBadge = el("modelBadge");
    const fileInput = el("fileInput");
    const btnLoadFile = el("btnLoadFile");
    const btnUnload = el("btnUnload");
    const btnSend = el("btnSend");
    const input = el("input");
    const temp = el("temp");
    const tempVal = el("tempVal");
    const maxTokens = el("maxTokens");
    const gpuLayers = el("gpuLayers");

    let wllama = null;
    let busy = false;

    (async () => {
      try {
        if (navigator.gpu) {
          const adapter = await navigator.gpu.requestAdapter();
          if (adapter) {
            gpuBadge.textContent = "WebGPU: 利用可";
            gpuBadge.className = "badge on";
          } else {
            gpuBadge.textContent = "WebGPU: adapter なし";
            gpuBadge.className = "badge off";
          }
        } else {
          gpuBadge.textContent = "WebGPU: 非対応";
          gpuBadge.className = "badge off";
        }
      } catch {
        gpuBadge.textContent = "WebGPU: エラー";
        gpuBadge.className = "badge off";
      }
    })();

    const samplesBox = el("samples");
    for (const q of SAMPLES) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = q;
      b.onclick = () => {
        if (busy || !wllama) return;
        input.value = q;
        send();
      };
      samplesBox.appendChild(b);
    }

    temp.oninput = () => { tempVal.textContent = Number(temp.value).toFixed(2); };
    fileInput.onchange = () => {
      btnLoadFile.disabled = !fileInput.files?.length;
      if (fileInput.files?.[0]) {
        status.textContent = `選択中: ${fileInput.files[0].name} (${(fileInput.files[0].size / 1e6).toFixed(2)} MB)`;
      }
    };

    function addMsg(role, text) {
      const d = document.createElement("div");
      d.className = `msg ${role}`;
      d.textContent = text;
      messages.appendChild(d);
      messages.scrollTop = messages.scrollHeight;
      return d;
    }

    function setBusy(v) {
      busy = v;
      btnSend.disabled = v || !wllama;
      input.disabled = v || !wllama;
      btnLoadFile.disabled = v || !fileInput.files?.length;
      btnUnload.disabled = v || !wllama;
    }

    function buildPrompt(question) {
      return `質問：${question}\n答え：`;
    }

    async function loadModelFromFiles(files) {
      setBusy(true);
      status.textContent = "wllama 初期化中…";
      progress.style.display = "block";
      progressBar.style.width = "5%";

      try {
        if (wllama) {
          try { await wllama.exit(); } catch (_) {}
          wllama = null;
        }

        wllama = new Wllama(CONFIG_PATHS, {
          logger: {
            debug: () => {},
            log: (...a) => console.log("[wllama]", ...a),
            warn: (...a) => console.warn("[wllama]", ...a),
            error: (...a) => console.error("[wllama]", ...a),
          },
        });
        // WebGPU on Safari / optional Firefox path
        try { wllama.setCompat("default"); } catch (_) {}

        const nGpu = Math.max(0, parseInt(gpuLayers.value || "99", 10));
        status.textContent = `モデル読込中… (n_gpu_layers=${nGpu})`;

        const blobs = Array.from(files);
        await wllama.loadModel(blobs, {
          n_ctx: 128,
          n_batch: 128,
          n_gpu_layers: nGpu,
        });

        progressBar.style.width = "100%";
        const name = files[0]?.name || "GGUF";
        modelBadge.textContent = name;
        modelBadge.className = "badge on";
        status.textContent = "準備完了 — チャットできます";
        addMsg("sys", `モデルを読み込みました: ${name}`);
        setBusy(false);
      } catch (err) {
        console.error(err);
        status.textContent = "読込失敗: " + (err?.message || err);
        modelBadge.textContent = "読込失敗";
        modelBadge.className = "badge off";
        addMsg("sys", "エラー: " + (err?.message || err));
        wllama = null;
        setBusy(false);
      } finally {
        setTimeout(() => {
          progress.style.display = "none";
          progressBar.style.width = "0%";
        }, 400);
      }
    }

    btnLoadFile.onclick = async () => {
      const files = fileInput.files;
      if (!files?.length) return;
      await loadModelFromFiles(files);
    };

    btnUnload.onclick = async () => {
      if (!wllama) return;
      setBusy(true);
      try { await wllama.exit(); } catch (_) {}
      wllama = null;
      modelBadge.textContent = "モデル未読込";
      modelBadge.className = "badge";
      status.textContent = "解放しました";
      addMsg("sys", "モデルを解放しました");
      setBusy(false);
      btnSend.disabled = true;
      input.disabled = true;
      btnUnload.disabled = true;
    };

    async function send() {
      const q = input.value.trim();
      if (!q || !wllama || busy) return;
      input.value = "";
      addMsg("user", q);
      const botEl = addMsg("bot", "…");
      setBusy(true);

      const prompt = buildPrompt(q);
      const t = Number(temp.value);
      const max_tokens = parseInt(maxTokens.value || "64", 10);

      try {
        let out = "";
        await wllama.createCompletion({
          prompt,
          max_tokens,
          temperature: t,
          top_p: 0.9,
          stop: ["</s>", "質問：", "\n質問"],
          stream: true,
          onData: (chunk) => {
            const piece = chunk?.choices?.[0]?.text ?? "";
            out += piece;
            botEl.textContent = out || "…";
            messages.scrollTop = messages.scrollHeight;
          },
        });

        let text = out.replace(/<\/s>/g, "").trim();
        if (text.startsWith("答え：")) text = text.slice(3).trim();
        botEl.textContent = text || "(空の応答)";
      } catch (err) {
        console.error(err);
        botEl.textContent = "エラー: " + (err?.message || err);
      }
      setBusy(false);
      input.focus();
    }

    btnSend.onclick = send;
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
  </script>
</body>
</html>
